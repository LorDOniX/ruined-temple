<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruined Temple TD – WebGL</title>
    <link rel="icon" href="/map/preview.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="float-layer"></div>
      <div id="drag-box" hidden></div>
      <div id="fade"></div>

      <!-- Human console (UI\FrameDef\UI\ConsoleUI.fdf): positions in UI units of the 0.8 × 0.6 screen, see style.css -->
      <div id="ui">
        <div class="backing" id="bk-minimap"></div>
        <div class="backing" id="bk-info"></div>
        <div class="backing" id="bk-card"></div>
        <div class="backing" id="bk-portrait-text"></div>
        <div id="minimap-wrap"><canvas id="minimap" width="256" height="256"></canvas></div>
        <div id="clock"><div id="clock-sky"></div></div>
        <div class="tile" id="t1-top"></div>
        <div class="tile" id="t2-top-l"></div>
        <div class="tile" id="t2-top-r"></div>
        <div class="tile" id="t3-top"></div>
        <div class="tile" id="t4-top"></div>
        <div class="tile" id="clock-frame"></div>
        <div class="tile" id="t1-bottom"></div>
        <div class="tile" id="t2-bottom"></div>
        <div class="tile" id="t3-bottom"></div>
        <div class="tile" id="t4-bottom"></div>
        <div class="tile" id="inventory-cover"></div>
        <div class="block" id="block-top"></div>
        <div class="block" id="block-1"></div>
        <div class="block" id="block-2"></div>
        <div class="block" id="block-3"></div>

        <div id="upper-buttons">
          <button class="upper" id="btn-quests" title="Úkoly (F9)">Úkoly <span class="hk">(F9)</span></button>
          <button class="upper" id="btn-menu" title="Nabídka (F10)">Nabídka <span class="hk">(F10)</span></button>
          <button class="upper" id="btn-allies" title="Spojenci (F11)">Spojenci <span class="hk">(F11)</span></button>
          <button class="upper" id="btn-chat" title="Chat (F12)">Chat <span class="hk">(F12)</span></button>
        </div>
        <div id="resources">
          <span class="res-icon" id="ri-gold"></span><span class="res-text" id="gold">0</span>
          <span class="res-icon" id="ri-lumber"></span><span class="res-text" id="lumber">0</span>
          <span class="res-icon" id="ri-supply"></span><span class="res-text" id="supply">0/10</span>
          <span id="upkeep">Žádná údržba</span>
        </div>

        <div id="multiboard" hidden>
          <div id="mb-title" class="wc3-box"></div>
          <div id="mb-min" class="wc3-box"></div>
          <div id="mb-body" class="wc3-box"><table id="mb-table"></table></div>
        </div>

        <div id="messages"></div>
        <div id="sys-messages"></div>
        <div id="chat" hidden><span id="chat-to">Všem:</span><input id="chat-input" maxlength="127" autocomplete="off" spellcheck="false" /></div>
        <div id="idle-worker" title="Nečinný dělník (Tab)"><span class="count">1</span></div>

        <div id="minimap-buttons">
          <div class="mm-btn" id="mm-ping" title="Signál (Alt+G)"></div>
          <div class="mm-btn" id="mm-terrain" title="Zobrazit terén (Alt+T)"></div>
          <div class="mm-btn" id="mm-ally" title="Barvy spojenců (Alt+A)"></div>
          <div class="mm-btn" id="mm-creep" title="Zobrazit příšery (Alt+C)"></div>
          <div class="mm-btn round" id="mm-formation" title="Pohyb ve formaci (Alt+F)"></div>
        </div>
        <div id="portrait"></div>
        <div id="portrait-hp"></div>
        <div id="portrait-mp"></div>
        <div id="info"></div>
        <div id="card"></div>
        <div id="tooltip" class="wc3-tooltip" hidden></div>
      </div>

      <!-- Game menu (UI\FrameDef\UI\EscMenuMainPanel.fdf, EscMenuOptionsPanel.fdf, EscMenuEndGamePanel.fdf) -->
      <div id="menu" class="wc3-panel" hidden>
        <div class="menu-view" id="menu-main">
          <h2>Nabídka</h2>
          <button id="btn-pause">Pozastavit hru (Pause)</button>
          <button id="btn-save">Uložit hru</button>
          <button id="btn-load">Nahrát hru</button>
          <button id="btn-options">Možnosti</button>
          <button id="btn-endgame">Ukončit hru</button>
          <button id="btn-help">Nápověda (F1)</button>
          <button id="btn-menu-close">Návrat do hry</button>
        </div>
        <div class="menu-view" id="menu-options" hidden>
          <h2>Možnosti</h2>
          <h3>Hra</h3>
          <button id="btn-speed">Rychlost hry: 1×</button>
          <label>Posun myší <input type="range" id="opt-mouse-scroll" min="0.25" max="2" step="0.05" /></label>
          <label>Posun klávesnicí <input type="range" id="opt-key-scroll" min="0.25" max="2" step="0.05" /></label>
          <button id="btn-keys">Klávesové zkratky: výchozí</button>
          <button id="btn-keys-file">Načíst CustomKeys.txt…</button>
          <input type="file" id="opt-keys-file" accept=".txt" hidden />
          <h3>Grafika</h3>
          <button id="btn-gfx-particles">Částice: vysoké</button>
          <button id="btn-gfx-textures">Textury: vysoké</button>
          <button id="btn-gfx-resolution">Rozlišení vykreslování: 100 %</button>
          <label><input type="checkbox" id="opt-shadows" /> Stíny jednotek</label>
          <h3>Zvuk</h3>
          <label><input type="checkbox" id="opt-sound" /> Zvukové efekty <input type="range" id="opt-sound-volume" min="0" max="1" step="0.05" /></label>
          <label><input type="checkbox" id="opt-music" /> Hudba <input type="range" id="opt-music-volume" min="0" max="1" step="0.05" /></label>
          <label><input type="checkbox" id="opt-ambient" /> Okolní zvuky</label>
          <h3>Ladění</h3>
          <button id="btn-regions">Regiony a trasa příšer (F2)</button>
          <button id="btn-pathing">Mapa průchodnosti (F3)</button>
          <button id="btn-options-back">OK</button>
        </div>
        <div class="menu-view" id="menu-save" hidden>
          <h2>Uložit hru</h2>
          <div class="save-list" id="save-list-save"></div>
          <label>Název <input type="text" id="save-name" maxlength="40" /></label>
          <button id="btn-save-do">Uložit</button>
          <button id="btn-save-back">Zpět</button>
        </div>
        <div class="menu-view" id="menu-load" hidden>
          <h2>Nahrát hru</h2>
          <div class="save-list" id="save-list-load"></div>
          <button id="btn-load-back">Zpět</button>
        </div>
        <div class="menu-view" id="menu-end" hidden>
          <h2>Ukončit hru</h2>
          <button id="btn-restart">Restartovat mapu</button>
          <button id="btn-quit">Vzdát hru</button>
          <button id="btn-end-back">Zpět</button>
        </div>
      </div>
      <div id="dialog" class="wc3-panel" hidden></div>
      <div id="modal" class="wc3-panel" hidden></div>
      <div id="end-screen" class="wc3-panel" hidden></div>
      <!-- Loading screen (UI\FrameDef\Glue\Loading.fdf): map preview, title / subtitle / text of war3map.w3i, loading bar. -->
      <div id="loading">
        <img id="loading-preview" src="map/preview.png" alt="" />
        <div id="loading-title"></div>
        <div id="loading-subtitle"></div>
        <div id="loading-text"></div>
        <div id="loading-label">Nahrávání…</div>
        <div id="loading-bar"><div class="bg"></div><div class="fill"></div><div class="glow"></div><div class="glass"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
